<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Texto en el aire</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#e9e9ee;font-family:system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
#editor{max-width:560px;margin:0 auto;padding:22px 18px 32px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
h1 span{color:var(--c)}
label.t{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8a8a96;margin-bottom:7px}
textarea{width:100%;height:110px;background:#0d0d11;color:#fff;border:1px solid #2a2a33;border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;resize:none;outline:none}
textarea:focus{border-color:var(--c)}
.row{display:flex;gap:12px;align-items:center}
.sw{display:flex;gap:12px}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid #2a2a33;padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 12px currentColor}
input[type=range]{width:100%;accent-color:var(--c)}
.val{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;color:#b8b8c2;font-size:14px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--c)}
#prevwrap{display:flex;gap:16px;align-items:center}
#prev{border:1px solid #23232b;border-radius:10px;background:#000;height:170px}
#info{font-size:13px;color:#9a9aa6;line-height:1.5}
#go{margin-top:6px;padding:16px;border:0;border-radius:14px;background:var(--c);color:#000;font-size:18px;font-weight:700;letter-spacing:.04em}
#go:active{filter:brightness(.8)}
#display{position:fixed;inset:0;background:#000;display:none;touch-action:none}
#display canvas{width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) 14px 14px;display:none;gap:10px;justify-content:space-between;align-items:center;background:linear-gradient(#000c,#0000)}
#hud button{background:#1b1b22;color:#fff;border:1px solid #3a3a46;border-radius:10px;padding:10px 14px;font-size:15px}
#hud .mid{font-size:13px;color:#aaa;text-align:center;flex:1}
#hint{position:absolute;left:0;right:0;bottom:8%;text-align:center;color:#888;font-size:14px;padding:0 24px;pointer-events:none;transition:opacity .8s}
</style>
</head>
<body>
<div id="editor">
  <h1>Texto <span>en el aire</span></h1>

  <div>
    <label class="t" for="msg">Mensaje</label>
    <textarea id="msg" maxlength="400" placeholder="Escribe tu mensaje…"></textarea>
  </div>

  <div id="prevwrap">
    <canvas id="prev"></canvas>
    <div id="info"></div>
  </div>

  <div>
    <label class="t">Color de los LEDs</label>
    <div class="sw" id="sw"></div>
  </div>

  <div>
    <label class="t">Resolución de puntos (filas)</label>
    <div class="row"><input type="range" id="rows" min="14" max="48" step="1"><span class="val" id="rowsV"></span></div>
  </div>

  <div>
    <label class="t">Grados de giro por letra</label>
    <div class="row"><input type="range" id="deg" min="4" max="40" step="1"><span class="val" id="degV"></span></div>
  </div>

  <div>
    <label class="t">Tamaño del punto</label>
    <div class="row"><input type="range" id="dot" min="25" max="50" step="1"><span class="val" id="dotV"></span></div>
  </div>

  <label class="chk"><input type="checkbox" id="upper"> Todo en mayúsculas (letras a toda altura)</label>
  <label class="chk"><input type="checkbox" id="inv"> Invertir el sentido del giro</label>

  <button id="go">▶ MOSTRAR</button>
</div>

<div id="display">
  <canvas id="cv"></canvas>
  <div id="hud">
    <button id="bExit">✕ Salir</button>
    <div class="mid" id="hudInfo"></div>
    <button id="bZero">⟲ Centrar</button>
  </div>
  <div id="hint">Gira el móvil de lado a lado, como una ventana.<br>Toca la pantalla para el menú.</div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const COLORS = ['#ff2a2a', '#33ff66', '#ffb000', '#f4f4ff', '#33ccff'];
const state = { text: 'HOLA', color: COLORS[0], rows: 24, deg: 14, dot: 40, upper: true, inv: false };
try { Object.assign(state, JSON.parse(localStorage.getItem('texto-aire') || '{}')); } catch (e) {}
function save() { try { localStorage.setItem('texto-aire', JSON.stringify(state)); } catch (e) {} }

/* ---------- Matriz de puntos ---------- */
// Cada letra ocupa exactamente una pantalla: 'cell' columnas x 'R' filas.
function cellFor(R, W, H) { return Math.max(6, Math.round(R * W / H)); }

function buildMatrix(text, R, cell, upper) {
  let t = text.replace(/\s+/g, ' ').trim();
  if (upper) t = t.toLocaleUpperCase('es');
  const chars = Array.from(t.length ? t : ' ');
  const n = chars.length, SS = 4, gw = cell * SS, gh = R * SS;
  const c = document.createElement('canvas'); c.width = gw; c.height = gh;
  const g = c.getContext('2d', { willReadFrequently: true });
  const base = upper ? R - 1 : Math.round(R * 0.8);          // fila de la línea base
  const capH = base - 1;                                      // 1 fila de margen arriba
  const fs = capH * SS / 0.71;
  const font = `bold ${fs}px "Roboto Condensed","Arial Narrow",Roboto,"Helvetica Neue",Arial,sans-serif`;
  g.font = font;
  const sx = Math.min(1, ((cell - 2) * SS) / g.measureText('W').width);
  const data = new Uint8Array(n * cell * R);
  const total = n * cell;
  chars.forEach((ch, i) => {
    g.clearRect(0, 0, gw, gh);
    if (ch !== ' ') {
      g.save();
      g.translate(gw / 2, base * SS);
      g.scale(sx, 1);
      g.font = font; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineWidth = fs * 0.05;
      g.fillText(ch, 0, 0); g.strokeText(ch, 0, 0);
      g.restore();
    }
    const px = g.getImageData(0, 0, gw, gh).data;
    for (let y = 0; y < R; y++) for (let x = 0; x < cell; x++) {
      let a = 0;
      for (let dy = 0; dy < SS; dy++) for (let dx = 0; dx < SS; dx++)
        a += px[(((y * SS + dy) * gw) + (x * SS + dx)) * 4 + 3];
      if (a / (SS * SS * 255) > 0.4) data[y * total + i * cell + x] = 1;
    }
  });
  return { data, total, R, cell, n };
}

const spriteCache = {};
function sprites(rad, color) {
  const key = rad.toFixed(1) + color;
  if (spriteCache[key]) return spriteCache[key];
  const halo = rad * 2, S = Math.ceil(halo * 2) + 2, mk = () => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
  const on = mk(), off = mk();
  let g = on.getContext('2d'), m = S / 2;
  const grd = g.createRadialGradient(m, m, rad * 0.6, m, m, halo);
  grd.addColorStop(0, color + '66'); grd.addColorStop(1, color + '00');
  g.fillStyle = grd; g.beginPath(); g.arc(m, m, halo, 0, 7); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(m, m, rad, 0, 7); g.fill();
  g.fillStyle = '#ffffff55'; g.beginPath(); g.arc(m - rad * .15, m - rad * .15, rad * .55, 0, 7); g.fill();
  g = off.getContext('2d');
  g.fillStyle = color + '1c'; g.beginPath(); g.arc(m, m, rad * 0.8, 0, 7); g.fill();
  return (spriteCache[key] = { on, off, S });
}

function draw(ctx, W, H, mx, scroll, color, dotF) {
  const px = W / mx.cell, py = H / mx.R, rad = Math.min(px, py) * dotF;
  const sp = sprites(rad, color), h = sp.S / 2;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const c0 = Math.floor(scroll) - 1, c1 = Math.ceil(scroll + mx.cell) + 1;
  for (let col = c0; col <= c1; col++) {
    const x = (col - scroll + 0.5) * px - h;
    if (x < -sp.S || x > W) continue;
    const inside = col >= 0 && col < mx.total;
    for (let r = 0; r < mx.R; r++) {
      const y = (r + 0.5) * py - h;
      ctx.drawImage(inside && mx.data[r * mx.total + col] ? sp.on : sp.off, x, y);
    }
  }
}

/* ---------- Editor ---------- */
const msg = $('#msg'), prev = $('#prev');
function applyColor() {
  document.documentElement.style.setProperty('--c', state.color);
  document.querySelectorAll('#sw button').forEach(b => b.classList.toggle('on', b.dataset.c === state.color));
}
COLORS.forEach(c => {
  const b = document.createElement('button'); b.dataset.c = c; b.style.background = c; b.style.color = c; b.setAttribute('aria-label', c);
  b.onclick = () => { state.color = c; applyColor(); save(); renderPreview(); };
  $('#sw').appendChild(b);
});
function bindRange(id, key, fmt) {
  const el = $('#' + id), out = $('#' + id + 'V');
  el.value = state[key]; out.textContent = fmt(state[key]);
  el.oninput = () => { state[key] = +el.value; out.textContent = fmt(state[key]); save(); renderPreview(); };
}
bindRange('rows', 'rows', v => v); bindRange('deg', 'deg', v => v + '°'); bindRange('dot', 'dot', v => v + '%');
msg.value = state.text;
msg.oninput = () => { state.text = msg.value; save(); renderPreview(); };
$('#upper').checked = state.upper; $('#upper').onchange = e => { state.upper = e.target.checked; save(); renderPreview(); };
$('#inv').checked = state.inv; $('#inv').onchange = e => { state.inv = e.target.checked; save(); };

function renderPreview() {
  const aspect = Math.min(innerWidth, innerHeight) / Math.max(innerWidth, innerHeight);
  const h = 170, w = Math.round(h * aspect), dpr = devicePixelRatio || 1;
  prev.style.width = w + 'px'; prev.style.height = h + 'px';
  prev.width = w * dpr; prev.height = h * dpr;
  const mx = buildMatrix(state.text, state.rows, cellFor(state.rows, w, h), state.upper);
  const ctx = prev.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(ctx, w, h, mx, 0, state.color, state.dot / 100);
  const sweep = Math.max(0, mx.n - 1) * state.deg;
  $('#info').innerHTML = `${mx.n} letra${mx.n === 1 ? '' : 's'}<br>Recorrido total: <b>${sweep}°</b>` +
    (sweep > 200 ? '<br><span style="color:#ffb000">Mucho giro: sube la resolución o baja los grados por letra.</span>' : '');
}
applyColor(); renderPreview();
addEventListener('resize', () => { if ($('#display').style.display !== 'block') renderPreview(); });

/* ---------- Pantalla de visualización ---------- */
const disp = $('#display'), cv = $('#cv'), hud = $('#hud'), hint = $('#hint');
let mx = null, W = 0, H = 0, dpr = 1, ctx = null, running = false, angle = 0, hudTimer = 0;
let gotSensor = false, lastT = 0, wakeLock = null;
const NATIVE = !!window.AndroidSensors;

function setup() {
  dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mx = buildMatrix(state.text, state.rows, cellFor(state.rows, W, H), state.upper);
  clampAngle();
}
function maxAngle() { return Math.max(0, (mx ? mx.n - 1 : 0)) * state.deg; }
function clampAngle() { angle = Math.min(maxAngle(), Math.max(0, angle)); }
function addYaw(dYawDeg) {                  // dYaw > 0 = giro antihorario visto desde arriba (hacia la izquierda)
  gotSensor = true;
  angle += (state.inv ? 1 : -1) * dYawDeg; clampAngle();
}

// Sensor en navegador (PWA/Chrome): integra la velocidad angular alrededor del eje vertical real.
function onMotion(e) {
  const rr = e.rotationRate, ag = e.accelerationIncludingGravity;
  if (!rr || rr.alpha == null) return;
  const now = performance.now(); const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0; lastT = now;
  let ux = 0, uy = 1, uz = 0;
  if (ag && ag.x != null) { const n = Math.hypot(ag.x, ag.y, ag.z) || 1; ux = ag.x / n; uy = ag.y / n; uz = ag.z / n; }
  let yaw = rr.beta * ux + rr.gamma * uy + rr.alpha * uz;     // deg/s sobre el eje "arriba"
  if (Math.abs(yaw) < 0.25) yaw = 0;
  addYaw(yaw * dt);
}
// Sensor nativo (APK): Java llama a esto con el giro acumulado en grados.
window.nativeYaw = d => { if (running) addYaw(d); };

function frame() {
  if (!running) return;
  draw(ctx, W, H, mx, (angle / state.deg) * mx.cell, state.color, state.dot / 100);
  const sc = mx.cell > 0 ? angle / state.deg : 0;
  $('#hudInfo').textContent = `letra ${Math.min(mx.n, Math.round(sc) + 1)} / ${mx.n} · ${Math.round(angle)}°` + (gotSensor ? '' : ' · sin sensor: arrastra con el dedo');
  requestAnimationFrame(frame);
}

async function show() {
  state.text = msg.value; save();
  if (!NATIVE && typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try { await DeviceMotionEvent.requestPermission(); } catch (e) {}
  }
  angle = 0; gotSensor = false; lastT = 0;
  disp.style.display = 'block'; $('#editor').style.display = 'none';
  setup(); running = true;
  if (NATIVE) window.AndroidSensors.setActive(true); else addEventListener('devicemotion', onMotion);
  try { await document.documentElement.requestFullscreen?.(); } catch (e) {}
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  hint.style.opacity = 1; setTimeout(() => hint.style.opacity = 0, 4000);
  requestAnimationFrame(frame);
}
function exit() {
  running = false;
  if (NATIVE) window.AndroidSensors.setActive(false); else removeEventListener('devicemotion', onMotion);
  try { wakeLock && wakeLock.release(); } catch (e) {}
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  disp.style.display = 'none'; hud.style.display = 'none'; $('#editor').style.display = 'flex';
  renderPreview();
}
window.teaBack = () => { if (running) { exit(); return true; } return false; };   // botón "atrás" del APK

$('#go').onclick = show;
$('#bExit').onclick = e => { e.stopPropagation(); exit(); };
$('#bZero').onclick = e => { e.stopPropagation(); angle = 0; };
addEventListener('resize', () => { if (running) setup(); });

function showHud() { hud.style.display = 'flex'; clearTimeout(hudTimer); hudTimer = setTimeout(() => hud.style.display = 'none', 4000); }
// Arrastre con el dedo (alternativa al sensor) y toque = menú
let down = null;
disp.addEventListener('pointerdown', e => { if (e.target.closest('#hud')) return; down = { x: e.clientX, moved: 0 }; disp.setPointerCapture(e.pointerId); });
disp.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.x; down.x = e.clientX; down.moved += Math.abs(dx);
  angle -= dx / W * state.deg; clampAngle();
});
disp.addEventListener('pointerup', () => { if (down && down.moved < 8) showHud(); down = null; });
addEventListener('keydown', e => {
  if (!running) return;
  if (e.key === 'ArrowRight') { angle += state.deg / 10; clampAngle(); }
  if (e.key === 'ArrowLeft') { angle -= state.deg / 10; clampAngle(); }
  if (e.key === 'Escape') exit();
});
</script>
</body>
</html>
